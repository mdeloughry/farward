name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches FARWARD_VERSION
        run: |
          version="$(./farward --version | awk '{print $2}')"
          if [[ "v${version}" != "$GITHUB_REF_NAME" ]]; then
            printf 'Tag %s does not match FARWARD_VERSION %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y expect netcat-openbsd
      - name: Run smoke test
        run: bash tests/smoke.sh

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build artifacts
        run: |
          mkdir -p dist
          cp farward install.sh README.md LICENSE dist/
          tar -czf "dist/farward-${GITHUB_REF_NAME}.tar.gz" \
            farward install.sh README.md LICENSE docs tests
          (cd dist && sha256sum farward install.sh "farward-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
